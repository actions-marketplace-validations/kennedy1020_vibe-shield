name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Test Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python (for Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build Bundle
        run: npm run build

      - name: Verify CLI Help Command
        run: node dist/cli.js --help

      - name: Run Test Fixture Scan
        run: node dist/cli.js scan test/fixtures || true