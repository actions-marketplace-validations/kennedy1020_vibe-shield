name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # Required to update floating tags and create GitHub releases
  id-token: write    # Required for npm provenance attestations

jobs:
  publish:
    name: Publish to npm & GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required to re-point floating major tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Artifacts
        run: npm run build

      - name: Publish to npm with Provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync Floating Major Tag (v1)
        run: |
          MAJOR_TAG=$(echo "${{ github.ref_name }}" | cut -d. -f1)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG pointer to ${{ github.ref_name }}"
          git push origin "$MAJOR_TAG" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true