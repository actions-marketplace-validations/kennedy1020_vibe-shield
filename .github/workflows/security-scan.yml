name: Security Audit & Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sarif-analysis:
    name: vibe-shield & SARIF Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep Engine
        run: pip install semgrep

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Action
        run: |
          npm install
          npm run build

      - name: Run vibe-shield
        uses: ./
        with:
          target-dir: 'src'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sarif: 'true'

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vibe-shield.sarif