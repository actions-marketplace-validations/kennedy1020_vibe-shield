name: 'vibe-shield'
description: 'AI code auditor & slopsquatting detector for Next.js, Supabase, Prisma, and payment stacks'
author: 'vibe-shield'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target-dir:
    description: 'Path to the directory to scan'
    required: false
    default: '.'
  github-token:
    description: 'GitHub Token for posting automated security scan summaries to Pull Requests'
    required: false
    default: ${{ github.token }}
  sarif:
    description: 'Generate SARIF v2.1.0 report for GitHub Code Scanning integration'
    required: false
    default: 'true'

outputs:
  sarif-file:
    description: 'Absolute path to the generated SARIF report file'

runs:
  using: 'node20'
  main: 'dist/index.js'