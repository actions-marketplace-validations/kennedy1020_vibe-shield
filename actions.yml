

  name: 'vibe-shield'
description: 'AI-generated code security auditor and slopsquatting detector'
inputs:
  github-token:
    description: 'GitHub token for PR comments and checks'
    required: false
  target-dir:
    description: 'Target directory to analyze'
    required: false
    default: '.'
  sarif:
    description: 'Generate SARIF report file for GitHub Code Scanning'
    required: false
    default: 'false'
outputs:
  sarif-file:
    description: 'Path to generated SARIF report'
runs:
  using: 'node20'
  main: 'dist/index.js'